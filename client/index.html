<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harate - Your World, Your Conversations. Talk freely, connect privately."
    />
    <title>Harate</title>

    <!--
      This tiny script runs BEFORE React loads. It reads the saved theme and adds the
      "dark" class to <html> immediately, so dark-mode users never see a white flash.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("harate-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (stored === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- React draws the whole app inside this one div -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
